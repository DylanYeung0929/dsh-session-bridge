name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile the CLI (syntax gate)
        run: python -m py_compile tools/dshctl.py tools/dshtool.py tools/ws.py tools/appenv.py

      - name: Unit tests (offline, no DSH required)
        run: python -m unittest discover -s tests -v

      - name: CLI surface smoke test
        run: |
          ./tools/dshctl.py --help > /dev/null
          ./tools/dshtool.py --help > /dev/null || true

      - name: Docs sanity (referenced files exist)
        run: |
          for f in README.md CHANGELOG.md LICENSE docs/PROTOCOL.md docs/TUTORIAL.md \
                   cordis.patch.yml lib/index.mjs bin/dshctl.mjs examples/send-and-read.sh; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: package.json is valid and declares the DSH bundle patch
        run: |
          node -e '
            const p = require("./package.json");
            if (!p.dsh?.bundle?.patch) throw new Error("package.json: missing dsh.bundle.patch");
            if (p.type !== "module") throw new Error("package.json: type must be module");
            if (!p.bin?.dshctl) throw new Error("package.json: missing bin.dshctl");
            console.log("package.json ok:", p.name, p.version);
          '

      - name: Plugin contract test (stubbed @deepseek-ai/dsh-tools)
        run: node tests/plugin.test.mjs

      - name: cordis.patch.yml shape
        run: |
          grep -qE '^\s*-\s*insert:' cordis.patch.yml
          grep -q "@dylanyeung/dsh-session-bridge" cordis.patch.yml